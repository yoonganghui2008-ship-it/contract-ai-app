<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>근로계약서 독소조항 AI 탐지기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-gray-800">

  <div class="max-w-lg mx-auto p-4 md:p-6">
    <header class="text-center my-6">
      <span class="text-xs font-bold text-red-600 bg-red-100 px-3 py-1 rounded-full uppercase tracking-wider">Worker Protect AI</span>
      <h1 class="text-2xl font-black text-slate-900 mt-2">근로계약서 독소조항 탐지기</h1>
      <p class="text-xs text-gray-500 mt-1">사진을 찍으면 AI 노무사가 불리한 조항을 분석해 드립니다.</p>
    </header>

    <!-- 업로드 영역 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4">
      <label class="block text-xs font-bold text-slate-700 mb-2">계약서 사진 찍기 또는 업로드</label>
      <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden">
      
      <button onclick="document.getElementById('imageInput').click()" class="w-full py-8 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center bg-slate-50 hover:bg-slate-100 transition">
        <svg class="w-8 h-8 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="text-xs font-semibold text-slate-600">카메라로 촬영하거나 사진 선택</span>
      </button>

      <div id="previewContainer" class="hidden mt-4">
        <img id="imagePreview" class="max-h-60 mx-auto rounded-lg border border-slate-200">
      </div>
    </div>

    <!-- 실행 버튼 -->
    <button id="analyzeBtn" onclick="analyzeContract()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-200">
      ⚖️ 독소조항 및 불이익 분석하기
    </button>

    <!-- 로딩 상태 -->
    <div id="loading" class="hidden my-8 text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-900 border-t-transparent mb-2"></div>
      <p class="text-xs font-bold text-slate-700">근로기준법 판례를 바탕으로 정밀 검토 중...</p>
    </div>

    <!-- 결과 출력 영역 -->
    <div id="resultContainer" class="hidden mt-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 text-slate-800 text-sm leading-relaxed">
      <div id="resultContent" class="prose prose-sm max-w-none space-y-3"></div>
    </div>

    <footer class="mt-8 text-center text-[11px] text-gray-400">
      ⚠️ 본 분석 결과는 AI에 의한 참고용 정보이며 법적 효력이 없습니다.
    </footer>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewContainer = document.getElementById('previewContainer');
    let base64Image = "";

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          imagePreview.src = event.target.result;
          previewContainer.classList.remove('hidden');
          base64Image = event.target.result.split(',')[1];
        };
        reader.readAsDataURL(file);
      }
    });

    async function analyzeContract() {
      const loading = document.getElementById('loading');
      const resultContainer = document.getElementById('resultContainer');
      const resultContent = document.getElementById('resultContent');

      if (!base64Image) { alert('근로계약서 사진을 첨부해주세요.'); return; }

      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');

      try {
        // 백엔드 서버리스 API 호출
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ base64Image })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        const rawMarkdown = data.candidates[0].content.parts[0].text;
        resultContent.innerHTML = marked.parse(rawMarkdown);
        resultContainer.classList.remove('hidden');

      } catch (error) {
        alert('분석 중 오류가 발생했습니다: ' + error.message);
      } finally {
        loading.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
